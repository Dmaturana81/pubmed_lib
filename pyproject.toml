[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmed-lib"
version = "1.0.0"
description = "PubMed search, fetch, and parse library with optional MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dmaturana81", email = "elmaturana@gmail.com" }]
dependencies = [
    "biopython>=1.83",
    "pydantic[email]>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0,<3"]

[project.scripts]
pubmed-mcp = "pubmed_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_entrez: live NCBI Entrez calls",
    "live_llm: live LLM provider calls",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["pubmed_lib"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["pubmed_lib"]
branch = true

[tool.coverage.report]
fail_under = 80
